# Production stack for PRISMA.
#
# Layout (sibling checkouts):
#   <parent>/
#     PRISMA/            <- this repo, build context for the API image
#     prisma-front/      <- frontend repo, build context for the web image
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# All secrets and public URLs are required via ${VAR:?message}; provide them
# through an untracked env file, e.g.:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# See DEPLOY.md for the full runbook.
name: prisma

# Shared API image. prisma-worker reuses the exact same build so that a single
# `up --build` always produces an image both services can run.
x-api-image: &api-image
  image: prisma-api:local
  build:
    context: .
    dockerfile: Dockerfile

services:
  prisma-web:
    build:
      context: ../prisma-front
      dockerfile: Dockerfile
    image: prisma-web:local
    container_name: prisma-web
    restart: unless-stopped
    # Only the reverse proxy is published to the host, over HTTP by default.
    ports:
      - "80:80"
    volumes:
      - project-covers:/srv/project-covers:ro
    networks:
      - public
      - internal
    depends_on:
      prisma-api:
        condition: service_healthy

  prisma-api:
    <<: *api-image
    container_name: prisma-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      API_PORT: "5685"
      DB_HOST: prisma-postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      REDIS_HOST: prisma-redis
      REDIS_PORT: "6379"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:?GOOGLE_REDIRECT_URI is required}
      FRONTEND_AUTH_SUCCESS_URL: ${FRONTEND_AUTH_SUCCESS_URL:?FRONTEND_AUTH_SUCCESS_URL is required}
      FRONTEND_AUTH_ERROR_URL: ${FRONTEND_AUTH_ERROR_URL:?FRONTEND_AUTH_ERROR_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      ALLOWED_GOOGLE_DOMAINS: ${ALLOWED_GOOGLE_DOMAINS:-edu.unirio.br,unirio.br}
      GOOGLE_OAUTH_STATE_TTL_SECONDS: ${GOOGLE_OAUTH_STATE_TTL_SECONDS:-300}
      GOOGLE_OAUTH_CLOCK_SKEW_SECONDS: ${GOOGLE_OAUTH_CLOCK_SKEW_SECONDS:-10}
      HTTP_CLIENT_TIMEOUT_SECONDS: ${HTTP_CLIENT_TIMEOUT_SECONDS:-10}
      HTTP_CLIENT_MAX_CONNECTIONS: ${HTTP_CLIENT_MAX_CONNECTIONS:-100}
      HTTP_CLIENT_MAX_KEEPALIVE_CONNECTIONS: ${HTTP_CLIENT_MAX_KEEPALIVE_CONNECTIONS:-20}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-edu.unirio.br}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_MINUTES: ${REFRESH_TOKEN_EXPIRE_MINUTES:-10080}
      PROJECT_COVER_UPLOAD_DIR: /app/project-covers
    volumes:
      - project-covers:/app/project-covers
    networks:
      - public
      - internal
    depends_on:
      prisma-postgres:
        condition: service_healthy
      prisma-redis:
        condition: service_healthy
      prisma-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5685/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  prisma-worker:
    <<: *api-image
    container_name: prisma-worker
    restart: unless-stopped
    command: ["python", "-m", "workers.sie_sync_worker"]
    environment:
      ENVIRONMENT: production
      DB_HOST: prisma-postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      # Required by Settings even though the worker does not run an HTTP server.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      SIE_API_BASE_URL: ${SIE_API_BASE_URL:-https://api.unirio.br/api/v2}
      SIE_EMAIL: ${SIE_EMAIL:?SIE_EMAIL is required}
      SIE_PASSWORD: ${SIE_PASSWORD:?SIE_PASSWORD is required}
      SIE_SYNC_PAGE_SIZE: ${SIE_SYNC_PAGE_SIZE:-500}
      SIE_SYNC_INTERVAL_DAYS: ${SIE_SYNC_INTERVAL_DAYS:-15}
      SIE_SYNC_RETRY_SECONDS: ${SIE_SYNC_RETRY_SECONDS:-300}
    networks:
      - public
      - internal
    depends_on:
      prisma-postgres:
        condition: service_healthy
      prisma-migrations:
        condition: service_completed_successfully

  prisma-postgres:
    image: postgres:16
    container_name: prisma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  prisma-redis:
    image: redis:7-alpine
    container_name: prisma-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot bootstrap. Creates the schema only on an empty database, then
  # always applies the idempotent safety and role-source migrations.
  #
  # migration_sie_publish_projects.sql is intentionally NOT mounted or run:
  # it rewrites publication_status/is_visible for every SIE project on each
  # start, mutating editorial state. Run it manually only after review.
  # migration_responsible_user_id.sql is legacy and does not match the current
  # schema (ownership lives in project_participations/permissions); ignore it.
  prisma-migrations:
    image: postgres:16
    container_name: prisma-migrations
    restart: "no"
    environment:
      PGHOST: prisma-postgres
      PGUSER: ${DB_USER:?DB_USER is required}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATABASE: ${DB_NAME:?DB_NAME is required}
    volumes:
      - ./schema.sql:/schema.sql:ro
      - ./migration_sie_sync_safety.sql:/migration_sie_sync_safety.sql:ro
      - ./migration_user_role_source.sql:/migration_user_role_source.sql:ro
    networks:
      - internal
    depends_on:
      prisma-postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -e
        if [ "$$(psql -Atqc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='users';")" = "0" ]; then
          echo 'Applying base schema...'
          psql -v ON_ERROR_STOP=1 -f /schema.sql
        else
          echo 'Schema already exists, skipping base schema (no destructive re-run).'
        fi
        echo 'Applying safety migration...'
        psql -v ON_ERROR_STOP=1 -f /migration_sie_sync_safety.sql
        echo 'Applying role source migration...'
        psql -v ON_ERROR_STOP=1 -f /migration_user_role_source.sql
        echo 'Migrations complete.'

networks:
  # Ingress network: publishes web and gives api/worker outbound access to
  # Google OAuth and the SIE API.
  public:
    driver: bridge
  # Data network: postgres, redis and migrations are unreachable from outside.
  internal:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
  project-covers:
